<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTE Care · 나의 장 리듬 (Simple UI)</title>
<style>
:root{
  --navy:#0A5580; --navy-800:#0D6A97; --navy-900:#073C5A;
  --teal:#128BC1; --teal-700:#0D74A6; --teal-50:#EAF7FC; --teal-300:#82CDE9;
  --coral:#128BC1; --coral-50:#EAF7FC;
  --amber:#A86717; --amber-50:#FFF7E7; --amber-200:#F4D9A6;
  --ink:#123044; --gray:#4D6472; --muted:#6C818D; --faint:#9BAAB2;
  --line:#E2EBEF; --line-2:#C9D9E1; --soft:#F3F8FA; --page:#E4F0F5;
  --cream:#F7FBFD; --clay:#8A5A2B; --clay-soft:#B08A63;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(145deg,#D9EBF3 0%,#EDF6FA 55%,#F5FAFC 100%);
  font-family:Pretendard,"맑은 고딕","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:var(--ink); display:flex; justify-content:center; min-height:100vh;
}
#app{width:100%;max-width:440px;background:var(--cream);min-height:100vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(16,40,59,.15)}
button,input,select{font-family:inherit}
button{cursor:pointer;border:0;background:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* 헤더 */
header{background:rgba(247,251,253,.95);color:var(--navy);padding:14px 18px 12px;position:sticky;top:0;z-index:20;
  border-bottom:1px solid rgba(23,50,79,.07);backdrop-filter:blur(16px)}
.htop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{width:92px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 6px 15px rgba(10,85,128,.12)}
.brandmark img{width:86px;height:31px;object-fit:contain;display:block}
.kick{color:var(--teal-700);font-size:10px;font-weight:800;margin:0 0 2px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:17px;font-weight:850;margin:0;letter-spacing:-.035em}
.pointpill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--navy);font-size:11px;font-weight:800;
  box-shadow:0 5px 14px rgba(23,50,79,.06)}
.tabs{display:flex;gap:4px;background:#E8F1F5;border-radius:15px;padding:4px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 10px;font-size:12px;border-radius:11px;color:#71818C}
.tabs button[aria-selected="true"]{background:#fff;color:var(--navy);font-weight:800;box-shadow:0 3px 10px rgba(23,50,79,.08)}
.datebar{display:flex;align-items:center;gap:8px}
.navbtn{width:32px;height:32px;border-radius:11px;background:#fff;color:var(--navy);font-size:17px;line-height:1;border:1px solid var(--line)}
.navbtn:disabled{opacity:.28;cursor:default}
.dlabel{flex:1;text-align:center}
.dlabel b{display:block;font-size:14px;font-weight:700}
.dlabel span{font-size:11px;color:var(--coral);font-weight:800}
header input[type=date]{background:#fff;color:var(--navy);border:1px solid var(--line);
  border-radius:11px;padding:7px 8px;font-size:11px}

/* 섹션 */
main{flex:1;padding:2px 0 126px;background:linear-gradient(180deg,var(--cream) 0%,#F1F7FA 55%,#EAF3F7 100%)}
section{padding:20px;margin:12px 14px 0;background:rgba(255,255,255,.96);border:1px solid rgba(23,50,79,.055);border-radius:22px;
  box-shadow:0 8px 24px rgba(23,50,79,.045)}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
h2{font-size:16px;font-weight:800;margin:0;letter-spacing:-.02em}
.count{font-size:12px;color:var(--teal);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.6}

/* 버튼류 */
.wide{width:100%;padding:13px;border-radius:14px;font-size:14px;border:1px solid transparent;
  background:#F1F6F8;color:var(--gray);transition:background .12s,border-color .12s,color .12s}
.wide[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.select-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{min-height:42px;padding:10px 12px;border-radius:13px;font-size:13px;border:1px solid transparent;
  background:#F2F6F8;color:#526875;transition:background .12s,border-color .12s,color .12s,transform .12s;
  display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.35}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.chip[aria-pressed="true"]:before{content:"✓";font-size:11px;margin-right:6px;color:#BDEBFA}
.chip-clear{grid-column:1/-1;background:#EAF3F7;color:var(--navy)}
.dash{width:100%;padding:12px;border-radius:14px;border:1px solid transparent;
  color:var(--teal);font-size:13.5px;font-weight:700;background:#EAF7FC}
.dash:hover{background:var(--teal-50)}

/* 배변 카드 */
.bowel{border:0;border-radius:18px;padding:14px;margin-bottom:14px;background:#F5F9FB}
.bhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.bhead b{font-size:12px;color:#334155}
.bhead .r{display:flex;align-items:center;gap:8px}
.bhead input[type=time]{font-size:12px;border:1px solid var(--line-2);border-radius:8px;padding:5px 7px;color:#334155}
.del{font-size:12px;color:var(--faint);padding:2px 4px}
.del:hover{color:#DC2626}
.grid7{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 8px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.grid7::-webkit-scrollbar{height:3px}.grid7::-webkit-scrollbar-thumb{background:#C6DCE6;border-radius:999px}
.cell{position:relative;flex:0 0 76px;scroll-snap-align:start}
.bt{width:100%;min-height:76px;border:1px solid transparent;border-radius:15px;padding:9px 8px;background:#fff;text-align:center;
  transition:border-color .12s,background .12s,box-shadow .12s}
.bt[aria-pressed="true"]{border-color:var(--teal);background:#EAF7FC;box-shadow:0 4px 12px rgba(10,85,128,.1)}
.bt .no{font-size:11px;font-weight:800;color:var(--faint);display:block;margin-bottom:3px}
.bt[aria-pressed="true"] .no{color:#0A5580}
.bt .nm{display:none}
.bt .bimg{width:100%;height:35px;object-fit:contain;display:block;margin:2px 0 0}
.bt .bimg.off{opacity:.85}
.bt[aria-pressed="true"] .bimg{opacity:1}
.bdesc{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.55;background:#EAF3F7;border-radius:12px;padding:10px 12px}
.bdesc b{display:block;color:var(--navy);font-size:12.5px;margin-bottom:2px}.bdesc span{display:block}
.help{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:999px;
  background:transparent;color:#9AAAB3;font-size:10px;font-weight:800;line-height:18px;text-align:center;z-index:2}
.help:hover{background:var(--navy);color:#fff}

/* 상세 설명 시트 */
.scrim{position:fixed;inset:0;background:rgba(11,27,48,.45);z-index:40;display:flex;align-items:flex-end;
  justify-content:center}
.sheet{width:100%;max-width:440px;background:#fff;border-radius:18px 18px 0 0;padding:18px 20px 22px;
  max-height:86vh;overflow:auto}
.shandle{width:38px;height:4px;border-radius:999px;background:var(--line-2);margin:0 auto 14px}
.stop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px}
.badge.good{background:var(--teal-50);color:#0A5580}
.badge.soft{background:#F1F5F9;color:#475569}
.badge.warn{background:var(--amber-50);color:#92400E}
.stop b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.stop .ty{font-size:11.5px;color:var(--faint);margin-left:auto}
.bigart{background:var(--soft);border-radius:14px;padding:16px;margin-bottom:14px}
.bigart img{width:100%;height:96px;object-fit:contain;display:block}
.frow{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.frow .k{width:74px;flex:none;font-size:12px;color:var(--faint);font-weight:700}
.frow .v{font-size:13px;color:#334155;line-height:1.7}
.sfoot{font-size:11px;color:var(--faint);line-height:1.7;margin:14px 0 16px}
.snav{display:flex;gap:8px}
.snav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line-2);
  background:#fff;font-size:13px;color:var(--gray)}
.snav button:disabled{opacity:.35}
.snav .close{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;flex:1.4}

/* 정도 */
.sev{background:transparent;border-radius:0;padding:3px 0 0;margin-top:10px}
.sev p{font-size:11.5px;color:var(--muted);margin:0 0 8px}
.sevrow{display:flex;gap:8px}
.sevrow button{flex:1;padding:10px;border-radius:12px;font-size:13px;border:1px solid transparent;background:#F2F6F8;color:var(--gray)}
.sevrow button[aria-pressed="true"]{background:var(--amber-50);border-color:var(--amber-200);color:#92400E;font-weight:700}

/* 입력 */
.txt{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line-2);font-size:13.5px;margin-bottom:12px}
.txt:focus{outline:none;border-color:var(--teal)}
.mealrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#F4F8FA;border-radius:14px;padding:7px 8px}
.mealrow .lb{width:40px;font-size:13px;font-weight:700;color:#334155;text-align:center}
.mealrow input[type=time]{flex:1;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:#fff;font-size:13px;color:#334155}
.mealrow input:disabled{background:#F1F5F9;color:#CBD5E1}
.skip{padding:9px 10px;border-radius:10px;font-size:11.5px;border:1px solid transparent;background:#E7EFF3;color:var(--muted);white-space:nowrap}
.skip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.extras{display:flex;gap:8px}
.extras>div{flex:1;display:flex;align-items:center;gap:7px}
.extras span{font-size:13px;color:var(--muted)}
.extras input{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);font-size:13px;color:#475569}
.sleep{display:flex;gap:11px}
.sleep select{flex:1;padding:12px;border-radius:13px;border:1px solid transparent;font-size:13.5px;
  color:#334155;background:#F2F6F8}
.optional-wrap{margin-top:8px;border-radius:14px;background:#F7FAFB;overflow:hidden}
.optional-wrap summary{list-style:none;padding:12px 14px;font-size:12.5px;font-weight:700;color:var(--teal);cursor:pointer}
.optional-wrap summary::-webkit-details-marker{display:none}
.optional-wrap summary:after{content:"＋";float:right;color:#8AA2AF}.optional-wrap[open] summary:after{content:"−"}
.optional-body{padding:0 8px 2px}.optional-body .mealrow:last-child{margin-bottom:8px}

.note{padding:18px 20px;font-size:11.5px;color:var(--faint);line-height:1.75;margin:0}

/* 리워드 스트립 */
.rw{margin:0;padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.rw.todo{background:linear-gradient(180deg,#F0F8FC 0%,#FFFFFF 100%)}
.rw.done{background:#fff}
.rwic{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800}
.rw.todo .rwic{background:var(--teal-50);color:var(--teal)}
.rw.done .rwic{background:var(--navy);color:var(--teal-300)}
.rwtx{flex:1;min-width:0}
.rwtx b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.rwtx span{display:block;font-size:11.5px;color:var(--muted);line-height:1.5}
.rwpt{text-align:right;flex:none}
.rwpt b{display:block;font-size:17px;font-weight:800;color:var(--navy);line-height:1}
.rwpt span{display:block;font-size:10.5px;color:var(--faint);margin-top:3px}
.streak{display:inline-flex;align-items:center;gap:4px;background:var(--amber-50);color:#92400E;
  font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:6px}

/* 획득 배너 */
.gain{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:50;
  background:var(--navy);color:#fff;border-radius:14px;padding:13px 20px;display:flex;align-items:center;gap:11px;
  box-shadow:0 10px 30px rgba(11,27,48,.3);animation:pop .28s ease-out}
.gain b{font-size:19px;font-weight:800;color:var(--teal-300)}
.gain .g2{font-size:11.5px;color:#CBD5E1;line-height:1.5}
.gain .g2 i{font-style:normal;display:block;color:#fff;font-size:12.5px;font-weight:700;margin-bottom:1px}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.gain{animation:none}}

/* 저장바 */
.savebar{position:fixed;bottom:0;width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);
  padding:11px 20px calc(11px + env(safe-area-inset-bottom))}
.savebar .row{display:flex;align-items:center;gap:12px}
.savebar .st{flex:1;font-size:11.5px;color:var(--muted)}
.saveb{padding:12px 26px;border-radius:12px;background:var(--teal);color:#fff;font-size:14px;font-weight:800}
.saveb:hover{background:#0A5580}
.err{font-size:11.5px;color:#DC2626;margin:0 0 7px}

/* 7일 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.stat{background:var(--soft);border-radius:12px;padding:15px 10px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:800;line-height:1}
.stat b i{font-size:14px;font-style:normal;margin-left:2px}
.stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.warnbox{background:var(--amber-50);border:1px solid var(--amber-200);border-radius:12px;padding:10px 12px}
.warnbox p{margin:0;font-size:11.5px;color:#92400E;line-height:1.6}
.chartbox{border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px;margin-bottom:14px}
.chead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.chead b{font-size:13px;font-weight:800}
.chead span{font-size:11px;color:var(--faint)}
.chartbox svg{width:100%;display:block}
.lgd{display:flex;flex-wrap:wrap;gap:10px;margin:9px 2px 0}
.lgd i{display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:10.5px;color:var(--muted)}
.lgd i em{width:9px;height:9px;border-radius:3px;display:inline-block}
.symrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:2px}
.symcell{border-radius:8px;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;line-height:1.2}
.symcell.none{background:var(--teal-50);color:#0A5580}
.symcell.mild{background:#FEF3C7;color:#92400E}
.symcell.moderate{background:#FDE68A;color:#7C2D12}
.symcell.severe{background:#FBBF24;color:#7C2D12}
.symcell.on{background:#FEF3C7;color:#92400E}
.symcell.miss{background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 4px,#EEF1F4 4px,#EEF1F4 8px);color:#CBD5E1}
.symlab{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:5px}
.symlab span{font-size:10px;color:var(--faint);text-align:center}
.cnote{font-size:11px;color:var(--faint);line-height:1.7;margin:12px 2px 0}

/* 이벤트(검사 · 섭취) */
.evrow{display:flex;gap:9px;margin-bottom:14px}
.ev{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-align:left}
.ev.set{border-color:var(--teal);background:var(--teal-50)}
.ev.set.violet{border-color:#128BC1;background:#EAF7FC}
.evtop{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.evdot{width:9px;height:9px;border-radius:3px;flex:none}
.evtop b{font-size:11.5px;font-weight:800;color:#334155}
.ev .big{font-size:16px;font-weight:800;color:var(--ink);line-height:1.2;display:block;margin-bottom:3px}
.ev .sub{font-size:10.5px;color:var(--muted);line-height:1.5;display:block}
.ev .add{font-size:11.5px;color:var(--teal);font-weight:700}
.dbadge{display:inline-block;background:#128BC1;color:#fff;font-size:10.5px;font-weight:800;
  padding:3px 9px;border-radius:999px;margin-left:6px}
.evbar{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);
  background:var(--soft);font-size:11.5px;color:#334155}
.evbar .k{display:inline-flex;align-items:center;gap:5px}
.evbar .k i{width:8px;height:8px;border-radius:2px;display:inline-block}
.evbar .sep{color:var(--line-2)}

/* 비교 블록 */
.cmp{border:1px solid var(--line);border-radius:14px;padding:14px 12px;margin-bottom:14px}
.cmprow{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;align-items:center;
  padding:9px 2px;border-top:1px solid var(--line)}
.cmprow:first-of-type{border-top:0}
.cmprow .lb{font-size:11px;color:#334155;font-weight:700}
.cmprow .v{text-align:center;font-size:13px;font-weight:800}
.cmprow .v small{display:block;font-size:9.5px;font-weight:400;color:var(--faint);margin-top:2px}
.cmphd{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin-bottom:6px}
.cmphd span{font-size:10px;color:var(--faint);text-align:center;font-weight:700}
.cmphd span:first-child{text-align:left}

/* 30일 히트맵 */
.hm{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.hmc{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:8px;color:#94A3B8}
.hmc.none{background:var(--teal-50)}
.hmc.on{background:#FEF3C7}
.hmc.mild{background:#FEF3C7}
.hmc.moderate{background:#FDE68A}
.hmc.severe{background:#FBBF24}
.hmc.miss{background:#F1F5F9}
.hmlg{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.hmlg i{display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:10px;color:var(--muted)}
.hmlg i em{width:9px;height:9px;border-radius:3px;display:inline-block}
.daylist{display:flex;flex-direction:column;gap:8px}
.dayb{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.dayb.empty{border-style:dashed;border-color:var(--line-2);background:var(--soft)}
.dayb:hover{border-color:var(--line-2)}
.dayb .t{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.dayb .t b{font-size:13.5px;font-weight:700}
.dayb .t em{font-style:normal;font-size:11.5px;color:var(--teal);font-weight:700}
.dayb .t em.off{color:var(--faint);font-weight:400}
.dayb p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6}
.tdy{font-size:11px;color:var(--teal);margin-left:6px;font-weight:700}
h3{font-size:13.5px;font-weight:800;margin:0 0 11px}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13.5px;padding:60px 0}
.empty-hint{font-size:12px;color:var(--faint);text-align:center;padding:10px 0}

/* ── v2 추가 ── */
.tagnote{font-size:11px;color:var(--faint);margin:-4px 0 0;line-height:1.6}
.moreb{margin-top:9px;font-size:12px;font-weight:700;color:var(--teal);padding:9px 11px;background:#EAF3F7;border-radius:11px}
.detail{margin-top:8px;background:#EAF3F7;border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:9px}
.drow{display:flex;align-items:center;gap:8px}
.drow .dk{width:52px;flex:none;font-size:11.5px;font-weight:700;color:#475569}
.seg{display:flex;gap:5px;flex:1}
.seg button{flex:1;padding:8px 4px;border-radius:9px;border:1px solid transparent;background:#fff;font-size:12px;color:var(--gray)}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.today1{margin:12px 14px 0;border:1px solid #C7E8F5;background:#F1F8FB;border-radius:18px;padding:14px 16px}
.today1 .t1k{display:block;font-size:11px;font-weight:800;color:var(--teal);margin-bottom:4px}
.today1 p{margin:0;font-size:13px;line-height:1.65;color:#1F2937}
.today1 .t1tip{margin-top:6px;font-size:12px;color:#475569}
.rpt{margin:12px 20px 0;display:flex;align-items:center;gap:10px;background:#EAF7FC;border:1px solid #C7E8F5;border-radius:14px;padding:11px 13px}
.rpt div{flex:1;min-width:0}
.rpt b{display:block;font-size:13px;color:#4C1D95}
.rpt span{display:block;font-size:11px;color:#0D74A6;line-height:1.5;margin-top:2px}
.rpt button{flex:none;background:#128BC1;color:#fff;font-size:12px;font-weight:800;padding:9px 12px;border-radius:10px}
.mis{border:1px solid var(--line);border-radius:14px;padding:13px 14px 10px;margin-bottom:14px}
.mis.in-log{margin:12px 14px 0;border:1px solid rgba(23,50,79,.06);border-radius:22px;padding:18px 18px 14px;background:#fff;
  box-shadow:0 8px 24px rgba(23,50,79,.045)}
.mishd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.mishd b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.mis:not(.in-log) .mishd b{font-size:13px}
.mishd span{font-size:10.5px;color:var(--faint);text-align:right}
.mrow{padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mt{font-size:13px;font-weight:700;color:#1F2937}
.mn{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.mrow.ok .mn{color:var(--teal)}
.mrow.ok .mt{color:#0A5580}
.mbar{height:6px;border-radius:999px;background:#EEF1F4;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--navy);border-radius:999px}
.mrow.ok .mbar i{background:var(--teal)}
.mwhy{display:block;font-size:10.5px;color:var(--faint);margin-top:5px}
.mfoot{font-size:10.5px;color:var(--faint);margin:6px 0 0;line-height:1.6}
.ins{background:linear-gradient(145deg,var(--navy),#214E63);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.ins.empty{background:var(--soft);color:var(--ink);border:1px dashed var(--line-2)}
.inshd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.inshd b{font-size:14px;font-weight:800}
.inshd span{font-size:10.5px;color:#94A3B8;text-align:right}
.insp{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.insl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.insl li{font-size:12.5px;color:#E2E8F0;line-height:1.55;padding-left:12px;position:relative}
.insl li:before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:999px;background:var(--teal-300)}
.insl li b{color:#fff;font-weight:800}
.insl li span{color:#94A3B8;font-size:11px}
.insl li span.up{color:var(--teal-300)}
.insl li span.dn{color:#FCD34D}
.acts{margin-top:12px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 11px}
.actk{display:block;font-size:11px;font-weight:800;color:var(--teal-300);margin-bottom:5px}
.acts p{margin:0;font-size:12.5px;line-height:1.6;color:#fff}
.acts p+p{margin-top:4px}
.ins .cnote{color:#94A3B8}
.bf{display:inline-block;font-size:10px;font-weight:700;color:#64748B;background:#F1F5F9;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}

/* ── Design v4: BIOMI welcome surface ── */
.welcome{position:relative;overflow:hidden;margin:12px 14px 0;border-radius:26px;padding:21px 145px 19px 20px;min-height:172px;
  color:#fff;background:linear-gradient(145deg,#073C5A 0%,#0A5580 60%,#128BC1 100%);box-shadow:0 16px 34px rgba(10,85,128,.23)}
.welcome:before,.welcome:after{content:"";position:absolute;border-radius:999px;background:rgba(255,255,255,.07)}
.welcome:before{width:120px;height:120px;right:-34px;top:-44px}.welcome:after{width:88px;height:88px;left:-34px;bottom:-52px}
.welcome .eyebrow{display:inline-flex;align-items:center;gap:6px;color:#B9E7F7;font-size:10.5px;font-weight:800;letter-spacing:.04em;margin-bottom:9px}
.welcome .eyebrow i{width:7px;height:7px;border-radius:50%;background:#7FD2EF;box-shadow:0 0 0 4px rgba(127,210,239,.15)}
.welcome h2{font-size:20px;line-height:1.35;color:#fff;margin:0 0 7px;letter-spacing:-.035em}
.welcome p{font-size:12px;line-height:1.6;color:#DCE9EB;margin:0;max-width:210px}
.welcome .mini{display:flex;gap:7px;margin-top:13px;position:relative;z-index:2}
.welcome .mini span{display:inline-flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:999px;
  padding:6px 8px;font-size:10px;color:#F4FAFD;white-space:nowrap}
.biomi{position:absolute;z-index:1;right:-2px;bottom:-10px;width:155px;height:155px;object-fit:contain;filter:drop-shadow(0 16px 16px rgba(6,27,38,.2))}
.progressline{height:5px;border-radius:999px;background:rgba(255,255,255,.13);margin-top:13px;width:150px;overflow:hidden;position:relative;z-index:2}
.progressline i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#86D8F2,#D8F4FC)}
.savebar{background:rgba(247,251,253,.96)!important;backdrop-filter:blur(16px);border-top:1px solid rgba(10,85,128,.09)!important}
.saveb{border-radius:14px!important;background:linear-gradient(135deg,#128BC1,#0A5580)!important;box-shadow:0 8px 18px rgba(10,85,128,.24)}
.rw{margin:12px 14px 0;border:1px solid rgba(23,50,79,.06)!important;border-radius:18px;padding:13px 15px;background:#fff!important}
.evbar{margin:12px 14px 0;border:1px solid rgba(23,50,79,.05);border-radius:16px;background:#F7F9F7;padding:11px 14px}
.rpt{margin:12px 14px 0;border-radius:18px}
.note{padding:20px 26px 8px}
@media(max-width:380px){.welcome{padding-right:126px}.biomi{width:142px;height:142px;right:-12px}.welcome p{max-width:190px}.welcome .mini{gap:4px}.welcome .mini span{font-size:9.5px}}
</style>

function bristolSVG(t,on){
  return '<img class="bimg'+(on?"":" off")+'" src="'+BIMG[t]+'" alt="">';
}

/* ── 날짜 ── */
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseY(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function shift(s,n){var d=parseY(s);d.setDate(d.getDate()+n);return ymd(d)}
function pretty(s){var d=parseY(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+WEEKD[d.getDay()]+"요일"}

/* ── 저장소 ── */
function keyFor(d){return "gutlog:"+d}
function load(d){try{var v=localStorage.getItem(keyFor(d));return v?JSON.parse(v):null}catch(e){return null}}
function store(d,o){localStorage.setItem(keyFor(d),JSON.stringify(o))}

/* ── 포인트 ── */
var P_BASE=10, P_TODAY=5, P_WEEK=20;
/* 지난 날 기록 포인트 정책 (결정 필요)
   true  = 지난 날 기록에도 기본 포인트 적립 (기존 테스트 버전 동작)
   false = 당일 기록만 적립 (기획안 초안 기준). 어느 쪽이든 지난 날 기록은 backfilled로 표시해 분석에서 구분 */
var BACKFILL_POINTS=false;
function getMeta(){try{var v=localStorage.getItem("gutlog:meta");return v?JSON.parse(v):{points:0}}catch(e){return{points:0}}}
function setMeta(m){localStorage.setItem("gutlog:meta",JSON.stringify(m))}
function streakFrom(anchor){
  var n=0,d=anchor;
  while(sameDayRec(load(d),d)){n++;d=shift(d,-1);}
  return n;
}
function currentStreak(){
  // 오늘 기록이 없으면 어제까지의 연속을 보여준다
  return load(today)?streakFrom(today):streakFrom(shift(today,-1));
}

function emptyDay(){return{bowelNone:false,bowels:[],discomfortNone:false,discomfort:[],otherText:"",
  severity:"",meals:{breakfast:"",lunch:"",dinner:""},skipped:{breakfast:false,lunch:false,dinner:false},
  extras:{snack:"",latenight:""},noLate:false,sleepH:"",sleepM:"",tags:[],tagsNone:false}}

/* ── 상태 ── */
var today=ymd(new Date()), date=today, tab="log", day=emptyDay(), dirty=false, savedAt=null, openDet={};

function mark(){dirty=true;paintStatus()}
function paintStatus(){
  var el=document.getElementById("status");
  if(dirty){el.textContent="저장하지 않은 변경이 있습니다";}
  else if(savedAt){el.innerHTML="저장됨 · "+new Date(savedAt).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})+
    (day.backfilled?" · 지난 날 기록":"")+
    (day.editCount?' · <button id="histBtn" style="color:var(--teal);font-weight:700;text-decoration:underline">수정 '+day.editCount+'회 보기</button>':"");
    var hb=document.getElementById("histBtn"); if(hb) hb.onclick=openHistory;}
  else{el.textContent="아직 기록하지 않은 날";}
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function welcomeCard(){
  var known=0;
  if(day.bowelNone||(day.bowels||[]).some(function(b){return !!b.bristol;})) known++;
  if(day.discomfortNone||(day.discomfort||[]).length||(day.otherText||"").trim()) known++;
  if(Object.keys(day.meals||{}).some(function(k){return !!day.meals[k];})||Object.keys(day.skipped||{}).some(function(k){return !!day.skipped[k];})) known++;
  if(day.sleepH!==""&&day.sleepH!=null) known++;
  var pct=Math.round(known/4*100), st=currentStreak();
  var lead=savedAt&&!dirty?"오늘 기록을 잘 남겼어요":"오늘의 장 리듬을 알려 주세요";

/* ── 기록 화면 ── */
function renderLog(){
  var m=document.getElementById("main"), h="";
  var count=day.bowelNone?0:day.bowels.length;

  h+=welcomeCard();
  h+=rewardStrip();
  h+=eventBar();
  h+=reportBanner();
  h+=dailyLine();

  h+='<section><div class="shead"><h2>배변</h2>'+(count>0?'<span class="count">'+count+'회</span>':'')+'</div>';
  h+='<p class="hint">횟수만큼 추가한 뒤 좌우로 넘겨 형태를 선택하세요.</p>';
  h+='<button class="wide" data-act="bowelNone" aria-pressed="'+day.bowelNone+'" style="margin-bottom:12px">오늘 배변 없음</button>';
  if(!day.bowelNone){
    if(day.bowels.length===0) h+='<p class="empty-hint">아래 버튼으로 오늘 본 배변을 추가하세요.</p>';
    day.bowels.forEach(function(b,i){
      h+='<div class="bowel"><div class="bhead"><b>'+(i+1)+'번째 배변</b><div class="r">'+
        '<input type="time" value="'+esc(b.time||"")+'" data-bt="'+i+'" aria-label="'+(i+1)+'번째 배변 시각">'+
        '<button class="del" data-act="delBowel" data-i="'+i+'">삭제</button></div></div><div class="grid7">';
      BRISTOL.forEach(function(t){
        var on=b.bristol===t.n;
        h+='<div class="cell"><button class="bt" aria-label="'+t.n+'형 '+t.label+'" aria-pressed="'+on+'" data-act="setB" data-i="'+i+'" data-n="'+t.n+'">'+
           '<span class="no">'+t.n+'형</span>'+bristolSVG(t.n,on)+'<span class="nm">'+t.label+'</span></button>'+
           '<button class="help" data-act="info" data-n="'+t.n+'" aria-label="'+t.n+'형 설명 보기">?</button></div>';
      });
      h+='</div>';
      if(b.bristol) h+='<p class="bdesc"><b>'+b.bristol+'형 · '+BRISTOL[b.bristol-1].label+'</b><span>'+BRISTOL[b.bristol-1].desc+'</span></p>';
      var dOpen=openDet[i]||b.amount||b.duration||b.incomplete;
      if(!dOpen){ h+='<button class="moreb" data-act="openDet" data-i="'+i+'">상세 입력 <span style="font-weight:400">(양 · 시간 · 잔변감)</span></button>'; }
      else {
        h+='<div class="detail"><div class="drow"><span class="dk">양</span><div class="seg">';
        AMOUNT.forEach(function(o){h+='<button data-act="amt" data-i="'+i+'" data-id="'+o.id+'" aria-pressed="'+(b.amount===o.id)+'">'+o.label+'</button>';});
        h+='</div></div><div class="drow"><span class="dk">걸린 시간</span><div class="seg">';
        DURATION.forEach(function(o){h+='<button data-act="dur" data-i="'+i+'" data-id="'+o.id+'" aria-pressed="'+(b.duration===o.id)+'">'+o.label+'</button>';});
        h+='</div></div><div class="drow"><span class="dk">잔변감</span><div class="seg">'+
          '<button data-act="inc" data-i="'+i+'" aria-pressed="'+(!!b.incomplete)+'">남은 느낌 있음</button></div></div></div>';
      }
      h+='</div>';
    });
    h+='<button class="dash" data-act="addBowel">배변 추가</button>';
  }
  h+='</section>';

  h+='<section><div class="shead"><h2>복부 불편</h2></div><p class="hint">오늘 느낀 항목만 선택하세요.</p><div class="chips select-grid symptom-chips" role="group" aria-label="복부 불편 선택">';
  h+='<button class="chip chip-clear" data-act="noDisc" aria-pressed="'+day.discomfortNone+'">불편 없음</button>';
  DISCOMFORT.forEach(function(d){
    h+='<button class="chip" data-act="disc" data-id="'+d.id+'" aria-pressed="'+(day.discomfort.indexOf(d.id)>-1)+'">'+d.label+'</button>';
  });
  h+='<button class="chip" data-act="disc" data-id="other" aria-pressed="'+(day.discomfort.indexOf("other")>-1)+'">기타</button></div>';
  if(day.discomfort.indexOf("other")>-1){
    h+='<input class="txt" id="otherTxt" maxlength="40" placeholder="어떤 불편이었는지 짧게 적어 주세요" value="'+esc(day.otherText)+'">';
  }
  var hasSym=!day.discomfortNone&&(day.discomfort.length>0||day.otherText.trim());
  if(hasSym){
    h+='<div class="sev"><p>오늘 하루 전체로 보면 어느 정도였나요</p><div class="sevrow">';
    SEVERITY.forEach(function(s){
      h+='<button data-act="sev" data-id="'+s.id+'" aria-pressed="'+(day.severity===s.id)+'">'+s.label+'</button>';
    });
    h+='</div></div>';
  }
  h+='</section>';

  h+='<section><div class="shead"><h2>식사 시각</h2></div><p class="hint">대략적인 시각이면 충분해요.</p>';
  MEALS.forEach(function(mm){
    h+='<div class="mealrow"><span class="lb">'+mm.label+'</span>'+
      '<input type="time" value="'+esc(day.meals[mm.id])+'" data-meal="'+mm.id+'" aria-label="'+mm.label+' 시각"'+(day.skipped[mm.id]?' disabled':'')+'>'+
      '<button class="skip" data-act="skip" data-id="'+mm.id+'" aria-pressed="'+day.skipped[mm.id]+'">먹지 않음</button></div>';
  });
  h+='<details class="optional-wrap"'+((day.extras.snack||day.extras.latenight||day.noLate)?' open':'')+'><summary>간식 · 야식 추가</summary><div class="optional-body">';
  EXTRAS.forEach(function(mm){
    var isL=mm.id==="latenight";
    h+='<div class="mealrow"><span class="lb">'+mm.label+'</span>'+
      '<input type="time" value="'+esc(day.extras[mm.id])+'" data-extra="'+mm.id+'" aria-label="'+mm.label+' 시각"'+(isL&&day.noLate?' disabled':'')+'>'+
      (isL?'<button class="skip" data-act="noLate" aria-pressed="'+!!day.noLate+'">먹지 않음</button>':'<span class="skip" style="visibility:hidden" aria-hidden="true">먹지 않음</span>')+'</div>';
  });
  h+='</div></details></section>';

  h+='<section><div class="shead"><h2>수면</h2></div><p class="hint">지난밤 잔 시간을 선택하세요.</p><div class="sleep">';
  h+='<select id="sh" aria-label="잔 시간"><option value="">시간</option>';
  for(var i=0;i<16;i++) h+='<option value="'+i+'"'+(String(day.sleepH)===String(i)?' selected':'')+'>'+i+'시간</option>';
  h+='</select><select id="sm" aria-label="잔 분"><option value="">분</option>';
  [0,15,30,45].forEach(function(v){h+='<option value="'+v+'"'+(String(day.sleepM)===String(v)?' selected':'')+'>'+v+'분</option>';});
  h+='</select></div></section>';

  h+='<section><div class="shead"><h2>오늘 있었던 일</h2><span class="count" style="color:var(--faint);font-weight:400">선택</span></div>'+
    '<p class="hint">기록에 영향을 줄 수 있는 항목만 선택하세요.</p><div class="chips select-grid factor-chips" role="group" aria-label="생활 요인 선택" style="margin-bottom:6px">';
  h+='<button class="chip chip-clear" data-act="tagNone" aria-pressed="'+!!day.tagsNone+'">해당 없음</button>';
  TAGS.forEach(function(t){
    h+='<button class="chip" data-act="tag" data-id="'+t.id+'" aria-pressed="'+((day.tags||[]).indexOf(t.id)>-1)+'">'+t.label+'</button>';
  });
  h+='</div></section>';

  if(weekStartOf(date)===weekStartOf(today)) h+=missionCard(true);

  h+='<p class="note">이 기록은 생활 관리를 돕기 위한 것이며 질병의 진단이나 치료를 목적으로 하지 않습니다. 혈변, 지속되는 복통, 의도하지 않은 체중 감소가 있다면 진료를 받아 보세요.</p>';

  m.innerHTML=h;
  bindLog();
  paintStatus();
}

function bindLog(){
  var m=document.getElementById("main");
  m.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click",function(){
      var a=b.dataset.act;
      if(a==="bowelNone"){day.bowelNone=!day.bowelNone; if(day.bowelNone) day.bowels=[];}
      else if(a==="addBowel"){day.bowels.push({bristol:0,time:""}); day.bowelNone=false;}
      else if(a==="delBowel"){day.bowels.splice(+b.dataset.i,1); openDet={};}
      else if(a==="setB"){day.bowels[+b.dataset.i].bristol=+b.dataset.n;}
      else if(a==="noDisc"){day.discomfortNone=!day.discomfortNone; day.discomfort=[]; day.otherText=""; day.severity="";}
      else if(a==="disc"){var id=b.dataset.id, k=day.discomfort.indexOf(id);
        if(k>-1){day.discomfort.splice(k,1); if(id==="other") day.otherText="";} else day.discomfort.push(id);
        day.discomfortNone=false;}
      else if(a==="sev"){day.severity=day.severity===b.dataset.id?"":b.dataset.id;}
      else if(a==="skip"){var i2=b.dataset.id; day.skipped[i2]=!day.skipped[i2]; if(day.skipped[i2]) day.meals[i2]="";}
      else if(a==="info"){openInfo(+b.dataset.n); return;}
      else if(a==="report"){openReport(+b.dataset.k); return;}
      else if(a==="openDet"){openDet[+b.dataset.i]=true; renderLog(); return;}
      else if(a==="amt"){var bb=day.bowels[+b.dataset.i]; bb.amount=bb.amount===b.dataset.id?"":b.dataset.id;}
      else if(a==="dur"){var bd=day.bowels[+b.dataset.i]; bd.duration=bd.duration===b.dataset.id?"":b.dataset.id;}
      else if(a==="inc"){var bi=day.bowels[+b.dataset.i]; bi.incomplete=!bi.incomplete;}
      else if(a==="tag"){day.tags=day.tags||[]; var tk=day.tags.indexOf(b.dataset.id); if(tk>-1) day.tags.splice(tk,1); else day.tags.push(b.dataset.id); day.tagsNone=false;}
      else if(a==="tagNone"){day.tagsNone=!day.tagsNone; if(day.tagsNone) day.tags=[];}
      else if(a==="noLate"){day.noLate=!day.noLate; if(day.noLate) day.extras.latenight="";}
      dirty=true; renderLog();
    });
  });
  var ot=document.getElementById("otherTxt");
  if(ot) ot.addEventListener("input",function(){day.otherText=ot.value; mark();});

    el.addEventListener("change",function(){day.bowels[+el.dataset.bt].time=el.value; mark();});
  });
  m.querySelectorAll("[data-meal]").forEach(function(el){
    el.addEventListener("change",function(){day.meals[el.dataset.meal]=el.value; mark();});
  });
  m.querySelectorAll("[data-extra]").forEach(function(el){

/* ── 그래프 (7일 / 30일 공용) ── */
function toneColor(t){ return (t===3||t===4)?"#128BC1":((t===1||t===2)?"#B45309":"#64748B"); }

function marksFor(rows){
  var m=[], set={}, sp=getSupp();
  getTests().forEach(function(t){
    var i=rows.map(function(r){return r.date}).indexOf(t.date);
    if(i>-1) m.push({i:i,c:C_TEST,l:"검사"});
  });
  if(sp&&sp.start){
    var i=rows.map(function(r){return r.date}).indexOf(sp.start);
    if(i>-1) m.push({i:i,c:C_SUPP,l:"섭취 시작"});
  }
  return m;
}
function drawMarks(marks,xOf,y0,y1,showLabel){
  var g="";
  marks.forEach(function(k){
    var x=xOf(k.i);
    g+='<line x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="'+y1+'" stroke="'+k.c+'" stroke-width="1.4" stroke-dasharray="3 3" opacity=".85"/>';
    if(showLabel){
      var w=k.l.length*6.4+10, lx=Math.max(2,Math.min(x-w/2,300-w));
      g+='<rect x="'+lx+'" y="'+(y0-11)+'" width="'+w+'" height="11" rx="5.5" fill="'+k.c+'"/>'+
         '<text x="'+(lx+w/2)+'" y="'+(y0-2.8)+'" font-size="7.5" fill="#fff" text-anchor="middle">'+k.l+'</text>';
    }
  });
  return g;
}

function chartBowel(rows){
  var n=rows.length, W=308, L=n>10?18:24, R=10;
  var GAP=(W-L-R)/(n-1), top=n>10?20:16, rowH=n>10?15:17;
  var bottom=top+6*rowH, labY=bottom+34;
  var xOf=function(i){return L+i*GAP};
  var g='<svg viewBox="0 0 '+W+' '+(labY+6)+'" role="img" aria-label="배변 형태 기록">';
  g+='<rect x="'+(L-6)+'" y="'+(top+2*rowH-7)+'" width="'+(W-L-2)+'" height="'+(rowH*2)+'" rx="6" fill="#EAF7FC"/>';
  for(var t=1;t<=7;t++){
    var y=top+(t-1)*rowH;
    g+='<line x1="'+(L-6)+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#EEF1F4" stroke-width="1"/>';
    if(n<=10||t%2===1)
      g+='<text x="1" y="'+(y+3.2)+'" font-size="'+(n>10?7.5:9)+'" fill="'+((t===3||t===4)?"#128BC1":"#94A3B8")+'">'+t+'형</text>';
  }
  g+=drawMarks(marksFor(rows),xOf,top-1,bottom+16,true);
  rows.forEach(function(r,i){
    var x=xOf(i), d=r.data, dt=parseY(r.date);
    var lab = n<=10 ? WEEKD[dt.getDay()] : ((i%5===0||i===n-1)?(dt.getMonth()+1)+"/"+dt.getDate():"");
    if(lab) g+='<text x="'+x+'" y="'+labY+'" font-size="'+(n>10?7.5:9.5)+'" fill="'+(d?"#64748B":"#CBD5E1")+'" text-anchor="middle">'+lab+'</text>';
    if(!d){ g+='<rect x="'+(x-4)+'" y="'+(bottom+13)+'" width="8" height="2.5" rx="1.2" fill="#E2E8F0"/>'; return; }
    if(d.bowelNone){ g+='<rect x="'+(x-5)+'" y="'+(bottom+13)+'" width="10" height="2.5" rx="1.2" fill="#94A3B8"/>'; return; }
    (d.bowels||[]).filter(function(b){return b.bristol}).forEach(function(b,k,arr){
      var y=top+(b.bristol-1)*rowH, r2=n>10?3.1:5;
      var off=arr.length>1?((k-(arr.length-1)/2)*(n>10?5:9)):0;
      g+='<circle cx="'+(x+off)+'" cy="'+y+'" r="'+r2+'" fill="'+toneColor(b.bristol)+'"/>';
    });
  });
  g+='</svg>';
  return '<div class="chartbox"><div class="chead"><b>배변 형태</b><span>점 하나가 배변 한 번</span></div>'+g+
    '<div class="lgd"><i><em style="background:#128BC1"></em>3·4형</i>'+
    '<i><em style="background:#B45309"></em>1·2형</i>'+
    '<i><em style="background:#64748B"></em>5·6·7형</i>'+
    '<i><em style="background:#94A3B8;height:3px;border-radius:2px"></em>배변 없음</i>'+
    '<i><em style="background:#E2E8F0"></em>미기록</i>'+
    '<i><em style="background:'+C_TEST+'"></em>검사일</i>'+
    '<i><em style="background:'+C_SUPP+'"></em>섭취 시작</i></div></div>';
}

function chartSleep(rows){
  var n=rows.length, W=308, L=20, R=8, GAP=(W-L-R)/(n-1);
  var base=78, maxH=58, MAXV=12, bw=n>10?5.5:18;
  var xOf=function(i){return L+i*GAP};
  var g='<svg viewBox="0 0 '+W+' 98" role="img" aria-label="수면 시간">';
  [0,4,8,12].forEach(function(v){
    var y=base-(v/MAXV)*maxH;
    g+='<line x1="'+(L-8)+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#EEF1F4"/>';
    g+='<text x="1" y="'+(y+3.2)+'" font-size="8" fill="#94A3B8">'+v+'</text>';
  });
  g+=drawMarks(marksFor(rows),xOf,14,base,false);
  rows.forEach(function(r,i){
    var x=xOf(i), d=r.data, dt=parseY(r.date);
    var has=d&&d.sleepH!==""&&d.sleepH!=null;
    if(has){
      var v=Math.min(MAXV,(+d.sleepH)+(+(d.sleepM||0))/60);
      var hh=Math.max(3,(v/MAXV)*maxH);
      g+='<rect x="'+(x-bw/2)+'" y="'+(base-hh)+'" width="'+bw+'" height="'+hh+'" rx="'+(n>10?2:4)+'" fill="#0F2540"/>';
      if(n<=10) g+='<text x="'+x+'" y="'+(base-hh-4)+'" font-size="8.5" fill="#64748B" text-anchor="middle">'+(Math.round(v*10)/10)+'</text>';
    } else {
      g+='<rect x="'+(x-bw/2)+'" y="'+(base-8)+'" width="'+bw+'" height="8" rx="2" fill="none" stroke="#CBD5E1" stroke-dasharray="2 2"/>';
    }
    var lab = n<=10 ? WEEKD[dt.getDay()] : ((i%5===0||i===n-1)?(dt.getMonth()+1)+"/"+dt.getDate():"");
    if(lab) g+='<text x="'+x+'" y="93" font-size="'+(n>10?7.5:9.5)+'" fill="'+(has?"#64748B":"#CBD5E1")+'" text-anchor="middle">'+lab+'</text>';
  });
  g+='</svg>';
  return '<div class="chartbox"><div class="chead"><b>수면 시간</b><span>시간 단위</span></div>'+g+'</div>';
}

var SEVN={mild:"가벼움",moderate:"보통",severe:"심함"};
function symClass(d){
  if(!d) return ["miss","—"];
  if(d.discomfortNone||((d.discomfort||[]).length===0&&!(d.otherText||"").trim())) return ["none","없음"];
  return [d.severity||"on","불편"];
}
function chartSymptom(rows){
  var cells="", labs="";
  rows.forEach(function(r){
    var c=symClass(r.data), lab=WEEKD[parseY(r.date).getDay()];

    cells+='<div class="symcell '+c[0]+'"><span>'+c[1]+'</span>'+(bot?'<span style="opacity:.75">'+bot+'</span>':'')+'</div>';
    labs+='<span>'+lab+'</span>';

  return '<div class="chartbox"><div class="chead"><b>복부 불편</b><span>기록한 정도</span></div>'+

}

var C_TEST="#2563EB", C_SUPP="#128BC1";
function getTests(){try{var v=localStorage.getItem("gutlog:tests");return v?JSON.parse(v):[]}catch(e){return[]}}
function setTests(a){localStorage.setItem("gutlog:tests",JSON.stringify(a))}
function getSupp(){try{var v=localStorage.getItem("gutlog:supp");return v?JSON.parse(v):null}catch(e){return null}}
function setSupp(o){ if(o) localStorage.setItem("gutlog:supp",JSON.stringify(o)); else localStorage.removeItem("gutlog:supp"); }
function daysBetween(a,b){return Math.round((parseY(b)-parseY(a))/86400000)}
function suppDay(d){var sp=getSupp(); if(!sp||!sp.start) return null;
  var n=daysBetween(sp.start,d); return n>=0?(n+1):null;}
function lastTest(){var t=getTests().slice().sort(function(a,b){return a.date<b.date?1:-1});return t[0]||null;}

  var baseP=(isToday||BACKFILL_POINTS)?P_BASE:0;

    '<div class="snav"><button id="ipv"'+(n<=1?" disabled":"")+'>이전 형태</button>'+
    '<button class="close" id="icl">닫기</button>'+
    '<button id="inx"'+(n>=7?" disabled":"")+'>다음 형태</button></div></div>';
  document.body.appendChild(w);
  w.addEventListener("click",function(e){if(e.target===w) closeInfo();});
  document.getElementById("icl").onclick=closeInfo;
  var pv=document.getElementById("ipv"), nx=document.getElementById("inx");
  if(!pv.disabled) pv.onclick=function(){closeInfo();openInfo(infoN-1)};
  if(!nx.disabled) nx.onclick=function(){closeInfo();openInfo(infoN+1)};
  document.addEventListener("keydown",escClose);
  document.getElementById("icl").focus();
}
function closeInfo(){
  var w=document.getElementById("scrim");
  if(w) w.parentNode.removeChild(w);
  document.removeEventListener("keydown",escClose);
}
function escClose(e){ if(e.key==="Escape") closeInfo(); }

/* ── 요약 화면 (7일 / 30일) ── */
function collect(n){
  var rows=[],i;
  for(i=n-1;i>=0;i--){var d=shift(today,-i); rows.push({date:d,data:load(d)});}
  return rows;
}
function statOf(rows){
  var f=rows.filter(function(r){return r.data});
  var bowel=0,noB=0,disc=0,sSum=0,sN=0,normal=0,bTot=0;
  f.forEach(function(r){
    var d=r.data;
    if(d.bowelNone) noB++; else {
      (d.bowels||[]).forEach(function(b){ bTot++; if(b.bristol===3||b.bristol===4) normal++; });
      bowel+=(d.bowels||[]).length;
    }
    if(!d.discomfortNone&&((d.discomfort||[]).length>0||(d.otherText||"").trim())) disc++;
    if(d.sleepH!==""&&d.sleepH!=null){sSum+=(+d.sleepH)*60+(+(d.sleepM||0)); sN++;}
  });
  return {days:f.length, bowel:bowel, noB:noB, disc:disc,
    avg:sN?Math.round(sSum/sN):null, normalRate:bTot?Math.round(normal/bTot*100):null,
    discRate:f.length?Math.round(disc/f.length*100):null};
}
function fmtAvg(m){return m==null?"—":(Math.floor(m/60)+":"+pad(m%60))}

function compareBlock(rows){
  var sp=getSupp(); if(!sp||!sp.start) return "";
  var idx=rows.map(function(r){return r.date}).indexOf(sp.start);
  if(idx<1||idx>rows.length-2) return "";
  var before=statOf(rows.slice(0,idx)), after=statOf(rows.slice(idx));
  if(before.days<3||after.days<3) return "";
  function row(lb,bv,av,unit){
    return '<div class="cmprow"><span class="lb">'+lb+'</span>'+
      '<span class="v" style="color:#64748B">'+(bv==null?"—":bv+unit)+'<small>'+before.days+'일 기록</small></span>'+
      '<span class="v" style="color:#0A5580">'+(av==null?"—":av+unit)+'<small>'+after.days+'일 기록</small></span></div>';
  }
  return '<div class="cmp"><div class="chead"><b>섭취 시작 전후</b><span>'+pretty(sp.start).replace("요일","")+' 기준</span></div>'+
    '<div class="cmphd"><span>항목</span><span>시작 전</span><span>시작 후</span></div>'+
    row("3·4형 비율", before.normalRate, after.normalRate, "%")+
    row("불편 기록한 날 비율", before.discRate, after.discRate, "%")+
    '<div class="cmprow"><span class="lb">평균 수면</span>'+
    '<span class="v" style="color:#64748B">'+fmtAvg(before.avg)+'<small>'+before.days+'일 기록</small></span>'+
    '<span class="v" style="color:#0A5580">'+fmtAvg(after.avg)+'<small>'+after.days+'일 기록</small></span></div>'+
    '<p class="cnote">기록한 날만으로 계산한 값입니다. 이 차이는 관찰된 변화일 뿐 섭취의 효과를 확인한 것이 아닙니다. 증상은 식사 · 수면 · 계절 등 다른 이유로도 달라집니다.</p></div>';
}

function renderSummary(n){
  var rows=collect(n), st=statOf(rows);
  var missing=rows.filter(function(r){return !r.data});
  var meta=getMeta(), streak=currentStreak();
  var winPts=0; rows.forEach(function(r){var a=r.data&&r.data.awarded; if(a) winPts+=(a.base||0)+(a.today||0)+(a.week||0);});
  var label = n===7?"최근 7일":"최근 30일";

  var h='<section><h2>'+label+'</h2><p class="hint">기록한 '+st.days+'일 기준입니다. 기록하지 않은 날은 계산에서 빼고 따로 표시합니다.</p>';
  h+=insightCard(n);
  h+=eventCards();
  h+='<div class="rw done" style="border:1px solid var(--line);border-radius:14px;margin-bottom:16px;padding:13px 14px">'+
     '<div class="rwic">P</div><div class="rwtx"><b>보유 포인트 '+meta.points.toLocaleString()+'P</b>'+
     '<span>'+label+' 기록 적립 '+winPts+'P'+(streak>0?' · 지금 '+streak+'일 연속':'')+'</span>'+
     '<span style="margin-top:3px;color:var(--faint)">포인트는 검사 · 제품 크레딧으로 바꿀 수 있도록 준비 중입니다</span></div></div>';
  if(n===7) h+=missionCard(false);
  h+='<div class="stats">'+
     '<div class="stat"><b>'+st.bowel+'<i>회</i></b><span>배변</span></div>'+
     '<div class="stat"><b>'+st.disc+'<i>일</i></b><span>불편 기록</span></div>'+
     '<div class="stat"><b>'+fmtAvg(st.avg)+'</b><span>평균 수면</span></div></div>';
  if(st.noB>0) h+='<p class="hint" style="margin-bottom:10px">배변이 없던 날 '+st.noB+'일'+
    (st.normalRate!=null?' · 3·4형 비율 '+st.normalRate+'%':'')+'</p>';
  if(missing.length) h+='<div class="warnbox"><p>기록하지 않은 날 '+missing.length+'일'+
    (n===7?(' — '+missing.map(function(r){return pretty(r.date).replace("요일","")}).join(", ")):'')+'</p></div>';
  h+='</section>';

  h+='<section><h3>기록 그래프</h3>';
  h+=chartBowel(rows)+(n===7?chartSymptom(rows):heatSymptom(rows))+chartSleep(rows);
  h+=compareBlock(rows);
  h+='<p class="cnote">기록하지 않은 날은 비워 두었습니다. 며칠치 기록만으로 좋아졌다거나 나빠졌다고 판단할 수는 없으며, 증상은 식사 외의 이유로도 달라집니다.</p>';
  h+='</section>';

  if(n===7){
    h+='<section style="border-bottom:0"><h3>날짜별</h3><div class="daylist">';
    rows.forEach(function(r){
      var d=r.data, isT=r.date===today, sd=suppDay(r.date);
      var tests=getTests().filter(function(x){return x.date===r.date});
      var tag=(tests.length?'<span class="tdy" style="color:'+C_TEST+'">검사</span>':'')+
              (sd?'<span class="dbadge">'+sd+'일차</span>':'');
      if(d){
        var bowels=d.bowelNone?"배변 없음":((d.bowels||[]).length+"회");
        var forms=d.bowelNone?"":(d.bowels||[]).filter(function(b){return b.bristol}).map(function(b){return b.bristol+"형"}).join(" · ");
        var sym;
        if(d.discomfortNone) sym="불편 없음";
        else {
          var parts=(d.discomfort||[]).filter(function(x){return x!=="other"}).map(function(x){
            var f=DISCOMFORT.filter(function(y){return y.id===x})[0]; return f?f.label:x;});
          if((d.otherText||"").trim()) parts.push(d.otherText.trim());
          sym=parts.join(", ");
        }
        var sleep=(d.sleepH!==""&&d.sleepH!=null)?("수면 "+d.sleepH+"시간 "+(d.sleepM||0)+"분"):"";
        var tg=(d.tags||[]).map(function(x){var f=TAGS.filter(function(y){return y.id===x})[0]; return f?f.label:""}).filter(Boolean).join(", ");
        var line=[forms,sym,sleep,tg].filter(Boolean).join("  ·  ");
        h+='<button class="dayb" data-go="'+r.date+'"><div class="t"><b>'+pretty(r.date)+
           (isT?'<span class="tdy">오늘</span>':'')+tag+(d.backfilled?'<span class="bf">지난 날 기록</span>':'')+'</b><em>'+bowels+'</em></div><p>'+esc(line||"기록함")+'</p></button>';
      } else {
        h+='<button class="dayb empty" data-go="'+r.date+'"><div class="t"><b>'+pretty(r.date)+
           (isT?'<span class="tdy">오늘</span>':'')+tag+'</b><em class="off">미입력</em></div><p>눌러서 지금 채우기</p></button>';
      }
    });
    h+='</div></section>';
  }
  document.getElementById("main").innerHTML=h;
  document.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click",function(){date=b.dataset.go; setTab("log");});
  });
  bindEvents();
}

/* ════════════════════════════════════════════
   v2 추가 기능 (2026.09 경쟁 분석 반영)
   1) 오늘 있었던 일 태그  2) 배변 상세 입력(선택)
   3) 저장 후 오늘의 한 줄  4) 패턴 카드 + 다음 행동
   5) 주간 미션 자동 생성  6) 지난 날 기록 표시 · 수정 이력
   7) 섭취 14일 · 28일 요약
   ════════════════════════════════════════════ */

/* ── v3: 기록 판정 도우미 ──
   "입력하지 않음"을 "하지 않음"으로 세지 않도록, 사용자가 명시적으로 답한 날만 계산에 넣는다 */
function tagsKnown(d){return !!(d&&(d.tagsNone||(d.tags||[]).length));}
function lateKnown(d){return !!(d&&((d.extras&&d.extras.latenight)||d.noLate));}
function bfKnown(d){return !!(d&&((d.meals&&d.meals.breakfast)||(d.skipped&&d.skipped.breakfast)));}
// 그 날 당일에 처음 남긴 기록인지 (지난 날에 몰아 입력한 기록은 미션·연속 기록에서 제외)
function sameDayRec(d,s){
  if(!d) return false;
  if(d.backfilled===true) return false;
  if(d.createdAt) return ymd(new Date(d.createdAt))===s;
  return true;
}

/* ── 5) 주간 미션 ── */
var MISSION_P=15;
function weekStartOf(s){var d=parseY(s), k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d);}
function recOf(s){return load(s);}
function sleepMin(d){return (d&&d.sleepH!==""&&d.sleepH!=null)?(+d.sleepH)*60+(+(d.sleepM||0)):null;}
function hasSym(d){return d&&!d.discomfortNone&&(((d.discomfort||[]).length>0)||((d.otherText||"").trim()!==""));}
function hasTag(d,id){return !!(d&&(d.tags||[]).indexOf(id)>-1);}

var MISSION_DEFS={
  rec5:{title:"이번 주 5일 기록하기",target:5,unit:"일",count:function(d){return 1;}},
  all7:{title:"이번 주 7일 모두 기록하기",target:7,unit:"일",count:function(d){return 1;}},
  sleep7:{title:"7시간 이상 잔 날 3일 만들기",target:3,unit:"일",
    count:function(d){var m=sleepMin(d);return m!=null&&m>=420?1:0;}},
  nolate:{title:"야식 안 먹은 날 4일 만들기",target:4,unit:"일",
    count:function(d){return (d.noLate&&!(d.extras&&d.extras.latenight))?1:0;}},
  breakfast:{title:"아침 먹은 날 4일 만들기",target:4,unit:"일",
    count:function(d){return (d.meals&&d.meals.breakfast)?1:0;}},
  noalcohol:{title:"음주 없는 날 5일 만들기",target:5,unit:"일",
    count:function(d){return (tagsKnown(d)&&!hasTag(d,"alcohol"))?1:0;}},
  bowtime:{title:"배변 시각까지 5회 남기기",target:5,unit:"회",
    count:function(d){return d.bowelNone?0:(d.bowels||[]).filter(function(b){return b.time}).length;}},
  tag3:{title:"\"오늘 있었던 일\" 3일 체크하기",target:3,unit:"일",
    count:function(d){return tagsKnown(d)?1:0;}}
};

function makeMissions(ws){
  var prev=[],i;
  for(i=14;i>=1;i--){var d=recOf(shift(ws,-i)); if(d) prev.push(d);}
  var pick=[], why={};
  function add(id,w){ if(pick.length<3&&pick.indexOf(id)<0){pick.push(id); why[id]=w;} }
  if(prev.length<10) add("rec5", prev.length?("지난 2주 기록 "+prev.length+"일"):"기록을 시작하는 주");
  var sl=prev.map(sleepMin).filter(function(v){return v!=null});
  if(sl.length>=3){var avg=Math.round(sl.reduce(function(a,b){return a+b},0)/sl.length);
    if(avg<420) add("sleep7","지난 2주 평균 수면 "+fmtAvg(avg));}
  var late=prev.filter(function(d){return d.extras&&d.extras.latenight}).length;
  if(late>=2) add("nolate","지난 2주 야식 "+late+"일");
  var alc=prev.filter(function(d){return hasTag(d,"alcohol")}).length;
  if(alc>=2) add("noalcohol","지난 2주 음주 "+alc+"일");
  var skipB=prev.filter(function(d){return d.skipped&&d.skipped.breakfast}).length;
  if(skipB>=3) add("breakfast","지난 2주 아침 거른 날 "+skipB+"일");
  var noTime=0; prev.forEach(function(d){(d.bowels||[]).forEach(function(b){if(!b.time) noTime++;});});
  if(noTime>=3) add("bowtime","시각 없이 남긴 배변 "+noTime+"회");
  var tagged=prev.filter(tagsKnown).length;
  if(tagged<3) add("tag3","패턴 카드에 쓸 정보가 부족해요");
  add("all7","꾸준함이 패턴을 만듭니다");
  return {week:ws, ids:pick, why:why, done:{}};
}
function getMissions(){
  var ws=weekStartOf(today), key="gutlog:missions:"+ws, m=null;
  try{var v=localStorage.getItem(key); m=v?JSON.parse(v):null;}catch(e){}
  if(!m){ m=makeMissions(ws); try{localStorage.setItem(key,JSON.stringify(m));}catch(e){} }
  return m;
}
function saveMissions(m){localStorage.setItem("gutlog:missions:"+m.week,JSON.stringify(m));}
function missionProgress(m){
  return m.ids.map(function(id){
    var def=MISSION_DEFS[id], n=0;
    for(var i=0;i<7;i++){var s=shift(m.week,i); if(s>today) break; var d=recOf(s); if(sameDayRec(d,s)) n+=def.count(d);}
    return {id:id, def:def, n:Math.min(n,def.target), done:!!m.done[id], why:m.why[id]||""};
  });
}
function checkMissions(){
  var m=getMissions(), got=[];
  missionProgress(m).forEach(function(p){
    if(!p.done && p.n>=p.def.target){ m.done[p.id]=new Date().toISOString(); got.push(p.def.title); }
  });
  if(got.length){ saveMissions(m); var meta=getMeta(); meta.points=(meta.points||0)+MISSION_P*got.length;
    meta.missionPts=(meta.missionPts||0)+MISSION_P*got.length; setMeta(meta); }
  return got;
}
function missionCard(compact){
  var m=getMissions(), ps=missionProgress(m);
  var end=shift(m.week,6), dn=ps.filter(function(p){return p.done}).length;
  var h='<div class="mis'+(compact?' in-log':'')+'"><div class="mishd"><b>이번 주 미션</b><span>'+
    pretty(m.week).replace(/ .요일/,"")+' ~ '+pretty(end).replace(/ .요일/,"")+' · 달성 '+dn+'/'+ps.length+'</span></div>';
  ps.forEach(function(p){
    var pct=Math.round(p.n/p.def.target*100);
    h+='<div class="mrow'+(p.done?' ok':'')+'"><div class="mtop"><span class="mt">'+esc(p.def.title)+'</span>'+
      '<span class="mn">'+(p.done?'달성 +'+MISSION_P+'P':p.n+'/'+p.def.target+p.def.unit)+'</span></div>'+
      '<div class="mbar"><i style="width:'+pct+'%"></i></div>'+
      (p.why?'<span class="mwhy">'+esc(p.why)+'</span>':'')+'</div>';
  });
  return h+'<p class="mfoot">지난 2주 기록을 보고 매주 월요일에 새로 고릅니다. 그 날 당일에 남긴 기록만 미션에 반영되며, 달성하면 미션마다 '+MISSION_P+'P를 드려요.</p></div>';
}

/* ── 3) 오늘의 한 줄 ── */
var PATTERN_DAYS=14, PATTERN_MIN=10, REL_MIN=5, TREND_MIN=5;
function winStat(endDate,n){
  var rows=[]; for(var i=n-1;i>=0;i--){var s=shift(endDate,-i); rows.push({date:s,data:load(s)});}
  return statOf(rows);
}
function recCount(endDate,n){var c=0; for(var i=0;i<n;i++){ if(load(shift(endDate,-i))) c++; } return c;}
function dailyLine(){
  if(!savedAt||dirty) return "";
  var r14=recCount(date,PATTERN_DAYS), cur=winStat(date,7), prev=winStat(shift(date,-7),7), msg="", tip="";
  if(r14<PATTERN_MIN){
    msg='최근 '+PATTERN_DAYS+'일 중 '+r14+'일을 기록했어요. '+PATTERN_MIN+'일이 되면 7일 탭에서 패턴 카드가 열려요.';
  } else if(cur.normalRate!=null&&cur.days>=TREND_MIN){
    msg='최근 7일 3·4형 비율은 '+cur.normalRate+'%예요';
    if(prev.days>=TREND_MIN&&prev.normalRate!=null){
      var df=cur.normalRate-prev.normalRate;
      msg+=df===0?', 그 전 7일과 같아요.':(', 그 전 7일보다 '+Math.abs(df)+'%p '+(df>0?'높아요.':'낮아요.'));
    } else msg+='.';
  } else {
    msg='최근 7일 중 '+cur.days+'일 기록했어요. 7일 중 '+TREND_MIN+'일 이상 기록하면 비율 변화를 알려 드려요.';
  }
  var forms=(day.bowels||[]).map(function(b){return b.bristol}).filter(Boolean);
  if(!day.bowelNone&&forms.length){
    if(forms.every(function(t){return t<=2})) tip='오늘은 단단한 형태였어요. 물과 채소를 조금 더 챙겨 보세요.';
    else if(forms.every(function(t){return t>=6})) tip='오늘은 묽은 형태였어요. 수분을 충분히 챙기고, 며칠 이어지면 진료를 받아 보세요.';
  } else if(day.bowelNone){
    var run=0,s=date; while(true){var d=load(s); if(d&&d.bowelNone){run++; s=shift(s,-1);} else break;}
    if(run>=3) tip='배변 없는 날이 '+run+'일째예요. 물과 식이섬유를 조금 더 챙겨 보세요.';
  }
  return '<div class="today1" role="status"><span class="t1k">오늘의 한 줄</span><p>'+msg+'</p>'+(tip?'<p class="t1tip">'+tip+'</p>':'')+'</div>';
}

/* ── 4) 패턴 카드 ──
   known: 그 요인에 대해 답한 날만 비교 대상
   lag: 음주·야식·외식은 다음 날 장 상태를 본다 (다음 날 기록이 있을 때만) */
var FACTORS=[
  {id:"alcohol",label:"음주한 다음 날",known:tagsKnown,lag:true,test:function(d){return hasTag(d,"alcohol")},act:"이번 주는 음주하는 날을 하루 줄여 보세요."},
  {id:"latenight",label:"야식 먹은 다음 날",known:lateKnown,lag:true,test:function(d){return !!(d.extras&&d.extras.latenight)},act:"야식 없는 날을 이틀 더 만들어 보세요."},
  {id:"eatout",label:"외식·여행한 다음 날",known:tagsKnown,lag:true,test:function(d){return hasTag(d,"eatout")},act:"외식하는 날은 채소 반찬을 한 가지 더해 보세요."},
  {id:"shortsleep",label:"6시간 미만 잔 날",known:function(d){return sleepMin(d)!=null},test:function(d){var m=sleepMin(d);return m!=null&&m<360},act:"잠자리에 드는 시각을 30분 앞당겨 보세요."},
  {id:"stress",label:"스트레스 있던 날",known:tagsKnown,test:function(d){return hasTag(d,"stress")},act:"스트레스가 큰 날은 식사 시각만이라도 일정하게 지켜 보세요."},
  {id:"period",label:"월경 중인 날",known:tagsKnown,test:function(d){return hasTag(d,"period")},act:"월경 기간에도 기록을 이어 가면 다음 주기와 비교할 수 있어요."},
  {id:"meds",label:"약 복용한 날",known:tagsKnown,test:function(d){return hasTag(d,"meds")},act:"약 복용 기간의 변화를 기록해 두고, 불편이 계속되면 처방받은 곳에 문의하세요."},
  {id:"exercise",label:"운동한 날",known:tagsKnown,test:function(d){return hasTag(d,"exercise")},act:"운동한 날의 흐름을 이어 가 보세요. 가벼운 걷기도 좋아요."},
  {id:"skipbf",label:"아침 거른 날",known:bfKnown,test:function(d){return !!(d.skipped&&d.skipped.breakfast)},act:"아침을 간단히라도 챙기는 날을 늘려 보세요."}
];
function relations(){
  var out=[], map={}, dates=[];
  for(var i=30;i>=0;i--){var s=shift(today,-i), d=load(s); if(d){map[s]=d; dates.push(s);}}
  FACTORS.forEach(function(f){
    var yes=[], no=[];
    dates.forEach(function(s){
      var d=map[s]; if(!f.known(d)) return;
      var out2=f.lag?map[shift(s,1)]:d; if(!out2) return;
      (f.test(d)?yes:no).push(hasSym(out2));
    });
    if(yes.length<REL_MIN||no.length<REL_MIN) return;
    var ry=Math.round(yes.filter(Boolean).length/yes.length*100), rn=Math.round(no.filter(Boolean).length/no.length*100);
    if(Math.abs(ry-rn)>=25) out.push({f:f,ry:ry,rn:rn,ny:yes.length,nn:no.length,diff:ry-rn});
  });
  out.sort(function(a,b){return Math.abs(b.diff)-Math.abs(a.diff)});
  return out.slice(0,2);
}
function insightCard(n){
  var r14=recCount(today,PATTERN_DAYS);
  if(r14<PATTERN_MIN){
    return '<div class="ins empty"><div class="inshd"><b>패턴 카드</b><span>'+r14+' / '+PATTERN_MIN+'일</span></div>'+
      '<p class="insp">최근 '+PATTERN_DAYS+'일 중 '+PATTERN_MIN+'일 이상 기록하면 내 기록에서 보이는 경향을 정리해 드려요. 지금 '+r14+'일 기록했어요.</p></div>';
  }
  var cur=winStat(today,n), prev=winStat(shift(today,-n),n);
  var items=[], acts=[];
  if(cur.normalRate!=null&&cur.days>=TREND_MIN){
    var t='3·4형 비율 <b>'+cur.normalRate+'%</b>';
    if(prev.days>=TREND_MIN&&prev.normalRate!=null){var df=cur.normalRate-prev.normalRate;
      t+=' <span class="'+(df>0?'up':(df<0?'dn':''))+'">(직전 '+n+'일 대비 '+(df>0?'+':'')+df+'%p)</span>';}
    items.push(t);
  }
  if(cur.discRate!=null&&cur.days>=TREND_MIN) items.push('불편을 기록한 날 <b>'+cur.discRate+'%</b>'+(prev.days>=TREND_MIN&&prev.discRate!=null?' <span>(직전 '+prev.discRate+'%)</span>':''));
  var rel=relations();
  rel.forEach(function(r){
    items.push(esc(r.f.label)+' 불편 기록 <b>'+r.ry+'%</b> <span>(그 외 '+r.rn+'% · '+r.ny+'일 / '+r.nn+'일 비교)</span>');
    if(r.diff>0||r.f.id==="exercise") acts.push(r.f.act);
  });
  if(!rel.length) items.push('<span>아직 뚜렷한 관계는 보이지 않아요. "오늘 있었던 일"과 야식 여부를 체크한 날이 쌓이면 비교할 수 있어요.</span>');
  if(cur.avg!=null&&cur.avg<420&&acts.length<3) acts.push("7시간 이상 자는 날을 늘려 보세요.");
  if(cur.noB>=2&&acts.length<3) acts.push("배변 없는 날이 있었어요. 물과 식이섬유를 조금 더 챙겨 보세요.");
  if(!acts.length) acts.push("지금처럼 기록을 이어 가면서 변화가 계속되는지 지켜보세요.");
  var h='<div class="ins"><div class="inshd"><b>패턴 카드</b><span>최근 '+n+'일 · 관계는 최근 30일, 비교할 날이 각 '+REL_MIN+'일 이상일 때</span></div><ul class="insl">';
  items.forEach(function(x){h+='<li>'+x+'</li>';});
  h+='</ul><div class="acts"><span class="actk">이번 주 해 볼 것</span>';
  acts.slice(0,3).forEach(function(a){h+='<p>'+esc(a)+'</p>';});
  return h+'</div><p class="cnote" style="margin-top:10px">함께 나타난 경향일 뿐, 원인이라고 단정할 수는 없습니다. 체크하지 않은 날은 비교에서 뺍니다.</p></div>';
}

/* ── 6) 수정 이력: 무엇이 어떻게 바뀌었는지 보관 ── */
function lab(arr,id){var f=arr.filter(function(o){return o.id===id})[0];return f?f.label:id;}
function descBowel(d){
  if(d.bowelNone) return "배변 없음";
  var b=d.bowels||[]; if(!b.length) return "미입력";
  return b.map(function(x){var p=[x.time||"시각 없음",x.bristol?x.bristol+"형":"형태 없음"];
    if(x.amount) p.push("양 "+lab(AMOUNT,x.amount)); if(x.duration) p.push(lab(DURATION,x.duration)); if(x.incomplete) p.push("잔변감");
    return p.join(" ");}).join(", ");
}
function descDisc(d){
  if(d.discomfortNone) return "불편 없음";
  var p=(d.discomfort||[]).map(function(x){return x==="other"?("기타"+(d.otherText?"("+d.otherText+")":"")):lab(DISCOMFORT,x)});
  return p.length?p.join(", ")+(d.severity?" · "+lab(SEVERITY,d.severity):""):"미입력";
}
function descMeal(d){
  var p=MEALS.map(function(m){return m.label+" "+((d.skipped&&d.skipped[m.id])?"안 먹음":((d.meals&&d.meals[m.id])||"—"))});
  p.push("간식 "+((d.extras&&d.extras.snack)||"—"));
  p.push("야식 "+(d.noLate?"안 먹음":((d.extras&&d.extras.latenight)||"—")));
  return p.join(" · ");
}
function descSleep(d){return (d.sleepH!==""&&d.sleepH!=null)?d.sleepH+"시간 "+(d.sleepM||0)+"분":"미입력";}
function descTags(d){if(d.tagsNone) return "해당 없음"; var p=(d.tags||[]).map(function(x){return lab(TAGS,x)}); return p.length?p.join(", "):"미입력";}
function diffDay(a,b){
  var S=[["배변",descBowel],["복부 불편",descDisc],["식사",descMeal],["수면",descSleep],["오늘 있었던 일",descTags]], out=[];
  S.forEach(function(x){var p=x[1](a), q=x[1](b); if(p!==q) out.push({k:x[0],from:p,to:q});});
  return out;
}
function openHistory(){
  var hs=(day.history||[]).filter(function(x){return x&&typeof x==="object"}).slice().reverse();
  var body=hs.length?hs.map(function(x){
    var t=new Date(x.at);
    return '<div class="frow" style="flex-direction:column;gap:4px"><span class="k" style="width:auto">'+(t.getMonth()+1)+'월 '+t.getDate()+'일 '+pad(t.getHours())+':'+pad(t.getMinutes())+' 수정</span>'+
      x.changes.map(function(c){return '<span class="v"><b>'+esc(c.k)+'</b><br><s style="color:#94A3B8">'+esc(c.from)+'</s><br>'+esc(c.to)+'</span>';}).join("")+'</div>';
  }).join(""):'<p class="sfoot">바뀐 내용이 기록된 수정이 없습니다. (이전 버전에서 저장한 수정은 시각만 남아 있습니다)</p>';
  var w=document.createElement("div"); w.className="scrim"; w.id="scrim";
  w.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="수정 기록"><div class="shandle"></div>'+
    '<div class="stop"><span class="badge soft">수정 기록</span><b>'+pretty(date)+'</b></div>'+body+
    '<p class="sfoot">처음 저장한 뒤 바꾼 내용이 최근 20회까지 남습니다.</p><div class="snav"><button class="close" id="icl">닫기</button></div></div>';
  document.body.appendChild(w);
  w.addEventListener("click",function(e){if(e.target===w) closeInfo();});
  document.getElementById("icl").onclick=closeInfo;
  document.addEventListener("keydown",escClose);
  document.getElementById("icl").focus();
}

/* ── 7) 섭취 14일 · 28일 요약 ── */
function getReports(){try{var v=localStorage.getItem("gutlog:reports");return v?JSON.parse(v):{}}catch(e){return{}}}
function setReports(o){localStorage.setItem("gutlog:reports",JSON.stringify(o))}
function pendingReport(){
  var sp=getSupp(); if(!sp||!sp.start) return null;
  var n=suppDay(today); if(!n) return null;
  var seen=getReports()[sp.start]||{};
  if(n>=28&&!seen[28]) return 28;
  if(n>=14&&!seen[14]) return 14;
  return null;
}
function reportBanner(){
  if(date!==today) return "";
  var k=pendingReport(); if(!k) return "";
  return '<div class="rpt"><div><b>섭취 '+k+'일 요약이 준비됐어요</b><span>시작 전 '+k+'일과 시작 후 '+k+'일 기록을 나란히 비교합니다</span></div>'+
    '<button data-act="report" data-k="'+k+'">요약 보기</button></div>';
}
function openReport(k){
  var sp=getSupp(); if(!sp) return;
  var b=[],a=[],i;
  for(i=k;i>=1;i--){var s=shift(sp.start,-i); b.push({date:s,data:load(s)});}
  for(i=0;i<k;i++){var s2=shift(sp.start,i); if(s2>today) break; a.push({date:s2,data:load(s2)});}
  var sb=statOf(b), sa=statOf(a);
  var r=getReports(); r[sp.start]=r[sp.start]||{}; r[sp.start][k]=new Date().toISOString(); setReports(r);
  function row(lb,bv,av){return '<div class="cmprow"><span class="lb">'+lb+'</span><span class="v" style="color:#64748B">'+bv+'</span><span class="v" style="color:#0A5580">'+av+'</span></div>';}
  function pct(v){return v==null?"—":v+"%";}
  var body;
  if(sb.days<3||sa.days<3){
    body='<p class="sfoot" style="margin:0 0 12px">비교하려면 시작 전과 후 각각 3일 이상 기록이 필요해요. 지금은 시작 전 '+sb.days+'일, 시작 후 '+sa.days+'일입니다.</p>';
  } else {
    body='<div class="cmp" style="margin:0 0 4px"><div class="cmphd"><span>항목</span><span>시작 전 '+k+'일</span><span>시작 후 '+k+'일</span></div>'+
      row("기록한 날",sb.days+"일",sa.days+"일")+row("3·4형 비율",pct(sb.normalRate),pct(sa.normalRate))+
      row("불편 기록한 날",pct(sb.discRate),pct(sa.discRate))+row("평균 수면",fmtAvg(sb.avg),fmtAvg(sa.avg))+'</div>';
  }
  var w=document.createElement("div"); w.className="scrim"; w.id="scrim";
  w.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="섭취 '+k+'일 요약"><div class="shandle"></div>'+
    '<div class="stop"><span class="badge" style="background:#EAF7FC;color:#0A5580">섭취 '+k+'일</span><b>시작 전후 요약</b>'+
    '<span class="ty">'+pretty(sp.start).replace("요일","")+' 시작</span></div>'+body+
    '<p class="sfoot">기록한 날만으로 계산한 관찰값입니다. 섭취의 효과를 확인한 것이 아니며, 증상은 식사 · 수면 · 계절 등 다른 이유로도 달라집니다.</p>'+
    '<div class="snav"><button class="close" id="icl">닫기</button></div></div>';
  document.body.appendChild(w);
  w.addEventListener("click",function(e){if(e.target===w){closeInfo(); renderLog();}});
  document.getElementById("icl").onclick=function(){closeInfo(); renderLog();};
  document.addEventListener("keydown",escClose);
  document.getElementById("icl").focus();
}


/* ── 전환 ── */
function loadDay(){
  var d=load(date);
  day=Object.assign(emptyDay(),d||{});
  savedAt=d&&d.updatedAt?d.updatedAt:null;
  dirty=false; openDet={};
}
function paintHeader(){
  document.getElementById("dLabel").textContent=pretty(date);
  document.getElementById("dToday").textContent=(date===today?"오늘":"");
  document.getElementById("dPick").value=date;
  document.getElementById("dPick").max=today;
  document.getElementById("nextD").disabled=(date>=today);
  document.getElementById("datebar").style.display=(tab==="log"?"flex":"none");
  document.getElementById("savebar").style.display=(tab==="log"?"block":"none");
  document.getElementById("tabLog").setAttribute("aria-selected",tab==="log");
  document.getElementById("tabWeek").setAttribute("aria-selected",tab==="week");
  document.getElementById("tabMonth").setAttribute("aria-selected",tab==="month");
  document.getElementById("pointPill").textContent=(getMeta().points||0).toLocaleString()+"P";
}
function setTab(t){
  tab=t; paintHeader();
  if(t==="log"){loadDay(); renderLog();} else {renderSummary(t==="month"?30:7);}
  window.scrollTo(0,0);
}
function go(d){date=d; loadDay(); paintHeader(); renderLog();}

document.getElementById("prevD").onclick=function(){go(shift(date,-1))};
document.getElementById("nextD").onclick=function(){if(date<today) go(shift(date,1))};
document.getElementById("dPick").onchange=function(e){if(e.target.value) go(e.target.value)};
document.getElementById("tabLog").onclick=function(){setTab("log")};
document.getElementById("tabWeek").onclick=function(){setTab("week")};
document.getElementById("tabMonth").onclick=function(){setTab("month")};
document.getElementById("saveBtn").onclick=function(){
  var err=document.getElementById("err");
  try{
    var stamp=new Date().toISOString(), prevRec=load(date);
    var first=!day.awarded, award=null;
    var hist=(prevRec&&prevRec.history)?prevRec.history.filter(function(x){return x&&typeof x==="object"}).slice(-19):[];
    var changes=prevRec?diffDay(prevRec,day):[];
    if(changes.length) hist.push({at:stamp,changes:changes});
    var o=Object.assign({},day,{updatedAt:stamp, createdAt:(prevRec&&prevRec.createdAt)||stamp,
      editCount:prevRec?((prevRec.editCount||0)+(changes.length?1:0)):0, history:hist,
      backfilled:prevRec?!!prevRec.backfilled:(date!==today)});
    day.createdAt=o.createdAt; day.editCount=o.editCount; day.history=hist; day.backfilled=o.backfilled;
    if(first){ award={base:((date===today||BACKFILL_POINTS)?P_BASE:0), today:(date===today?P_TODAY:0), week:0}; o.awarded=award; }
    store(date,o);
    if(first){
      var st=streakFrom(date);
      if(date===today && st>0 && st%7===0){ award.week=P_WEEK; o.awarded=award; store(date,o); }
      var got=award.base+award.today+award.week;
      var meta=getMeta(); meta.points=(meta.points||0)+got; setMeta(meta);
      day.awarded=award;
      var parts='기본 '+award.base+'P'+(award.today?' · 당일 '+award.today+'P':'')+(award.week?' · 7일 연속 '+award.week+'P':'');
      if(got>0) showGain(got,parts,st);
    }
    var ms=checkMissions();
    if(ms.length){ setTimeout(function(){ showGain(MISSION_P*ms.length, esc(ms.join(', ')), 0, '주간 미션 달성'); }, first?1600:0); }
    savedAt=stamp; dirty=false; err.hidden=true; renderLog();
  }catch(e){ err.textContent="저장하지 못했습니다. 브라우저의 저장 공간을 확인해 주세요."; err.hidden=false; }
};

loadDay(); paintHeader(); renderLog();
</script>
